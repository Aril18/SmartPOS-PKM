<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartPOS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="loginPage" class="login-page">

        <div class="login-card">

    <div class="brand-mark">
        SP
    </div>

    <h1>
        SmartPOS
    </h1>

    <p class="muted">
        Sistem Pengendalian Penjualan dan Stok UMKM
    </p>


    <!-- ROLE -->

    <div class="login-role-title">
        Masuk sebagai
    </div>


    <div class="role-selector">

        <button
            type="button"
            class="role-option active"
            data-role="KASIR"
        >

            <span class="role-icon">
                👤
            </span>

            <div>

                <strong>
                    Pegawai
                </strong>

                <small>
                    Kasir & operasional
                </small>

            </div>

        </button>


        <button
            type="button"
            class="role-option"
            data-role="OWNER"
        >

            <span class="role-icon">
                👑
            </span>

            <div>

                <strong>
                    Owner
                </strong>

                <small>
                    Pengelolaan usaha
                </small>

            </div>

        </button>

    </div>


    <form
        id="loginForm"
        class="form-stack"
    >

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Masukkan username"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            class="btn btn-primary btn-block"
            type="submit"
        >
            Login sebagai Pegawai
        </button>


        <p
            id="loginError"
            class="form-error"
        >
        </p>

    </form>

</div>
    </section>

  <script src="shared/database.js"></script>
<script src="script.js"></script>

</body>

</html>
